<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Ripple MCP — AI agents risk-check files before touching them</title>
  <desc id="desc">Flow diagram: an MCP client calls ripple mcp with the impact tool for src/auth/session.ts; ripple answers with the blast radius — 7 affected files, 4 routes, MEDIUM risk.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="300" rx="14" fill="url(#bg2)" filter="url(#glow2)"/>
  <rect x="0" y="0" width="760" height="36" rx="14" fill="#161b22" stroke="#21262d"/>
  <rect x="0" y="22" width="760" height="14" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="380" y="24" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8b949e">ripple mcp — risk-checking before the change</text>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">
    <text x="30" y="72" fill="#79c0ff" font-weight="700">AI agent</text>
    <text x="30" y="92" fill="#e6edf3">"can I safely touch</text>
    <text x="30" y="107" fill="#e6edf3">session.ts?"</text>
  </g>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11">
    <rect x="210" y="52" width="170" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="222" y="72" fill="#8b949e">tools/call</text>
    <text x="222" y="88" fill="#79c0ff">impact</text>
    <text x="222" y="104" fill="#e6edf3">file: src/auth/</text>
    <text x="222" y="118" fill="#e6edf3">session.ts</text>
    <text x="222" y="134" fill="#8b949e">maxDepth: 3</text>
  </g>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">
    <rect x="430" y="52" width="300" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="445" y="72" fill="#3fb950" font-weight="700">ripple mcp</text>
    <text x="445" y="90" fill="#8b949e">runs the real analysis</text>
    <text x="445" y="108" fill="#8b949e">on your local codebase</text>
    <text x="445" y="126" fill="#8b949e">(impact · dependents · risk · gate_status)</text>
  </g>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">
    <text x="30" y="220" fill="#3fb950" font-weight="700">Blast radius</text>
    <text x="30" y="244" fill="#e6edf3">7 affected files</text>
    <text x="30" y="264" fill="#e6edf3">4 routes · 2 components · 1 test</text>
    <text x="30" y="284" fill="#d29922">MEDIUM risk · 34.7/100</text>
  </g>

  <path d="M 388 92 H 424" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M 580 140 V 172" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>
