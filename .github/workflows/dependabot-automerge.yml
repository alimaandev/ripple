# Dependabot PRs are gated only by the required status checks, so arm
# auto-merge directly. GitHub Actions cannot approve PRs (the GITHUB_TOKEN
# permission was revoked), so the old approval step is gone; auto-merge
# still waits for the full CI suite before squashing.

name: Dependabot automerge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable auto-merge
        run: gh pr merge "$PR" --auto --squash
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}