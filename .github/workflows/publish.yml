name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "Publishing ${version} from ${GITHUB_REF_NAME}"

      - name: Pack and smoke-test the tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

          # The published package must contain the CLI entry point and schema.
          # Capture the listing once: piping tar into `grep -q` makes grep exit
          # after the first match, which closes the pipe and fails tar.
          listing="${RUNNER_TEMP}/tarball-files.txt"
          tar -tzf "$tarball" > "$listing"
          for required in package/dist/bin.js package/ripple.schema.json; do
            if ! grep -qx "$required" "$listing"; then
              echo "::error::Packed tarball is missing ${required}"
              exit 1
            fi
          done

          tmp="$(mktemp -d)"
          cd "$tmp"
          npm init -y > /dev/null
          npm install "${GITHUB_WORKSPACE}/${tarball}" --no-audit --no-fund > /dev/null
          installed="$(./node_modules/.bin/ripple --version)"
          expected="$(node -p "require('${GITHUB_WORKSPACE}/package.json').version")"
          if [ "$installed" != "$expected" ]; then
            echo "::error::Packed CLI reported ${installed}, expected ${expected}"
            exit 1
          fi

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --access public \
            --provenance \
            --tag "$dist_tag"
